<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facige Master</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #0a0e1a; font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Sora', sans-serif; }
  .glass { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); }
  .gradient-text { background: linear-gradient(135deg, #fff, #818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn-gradient { background: linear-gradient(135deg, #6366f1, #8b5cf6); transition: all .2s; cursor: pointer; }
  .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(99,102,241,.55); }
  .btn-gradient:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .input-field { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); color: #fff; }
  .input-field:focus { border-color: #818cf8; outline: none; }
  .input-field::placeholder { color: rgba(255,255,255,.3); }
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .table-row:hover { background: rgba(99,102,241,.08); }
  .badge-active { background: rgba(34,197,94,.15); color: #86efac; }
  .badge-inactive { background: rgba(239,68,68,.15); color: #fca5a5; }
  .badge-trial { background: rgba(99,102,241,.15); color: #a5b4fc; }
  .action-btn { cursor: pointer; transition: all .15s; }
  .action-btn:hover { transform: scale(1.1); }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
  <div class="glass rounded-3xl p-8 max-w-md w-full">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mb-4">
        <span class="text-3xl">👑</span>
      </div>
      <h1 class="font-display text-3xl font-bold gradient-text">Facige Master</h1>
      <p class="text-slate-400 text-sm mt-2">Gestão de Empresas</p>
    </div>
    <div id="loginMsg" class="hidden mb-4 px-4 py-3 rounded-xl text-sm"></div>
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">📧 Email</label>
        <input type="email" id="loginEmail" class="input-field w-full px-4 py-3 rounded-xl text-sm" value="admin@facige.com" required>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">🔒 Senha</label>
        <input type="password" id="loginSenha" class="input-field w-full px-4 py-3 rounded-xl text-sm" required>
      </div>
      <button type="submit" id="loginBtn" class="btn-gradient w-full py-4 rounded-xl text-white font-semibold text-sm">
        Acessar Painel Master
      </button>
    </form>
  </div>
</div>

<!-- PAINEL -->
<div id="appShell" class="hidden min-h-screen">
  <header class="border-b border-white/10 sticky top-0 z-40" style="background:rgba(10,14,26,.8);backdrop-filter:blur(12px)">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
          <span class="text-xl">👑</span>
        </div>
        <div>
          <h1 class="font-display font-bold gradient-text text-lg">Facige Master</h1>
          <p class="text-[10px] uppercase tracking-wider text-amber-400">Painel de Gestão</p>
        </div>
      </div>
      <button id="btnLogout" class="btn-gradient px-4 py-2 rounded-lg text-xs font-semibold">Sair</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- KPIs -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="glass rounded-2xl p-5">
        <p class="text-xs text-slate-400 font-semibold uppercase mb-2">Total de Empresas</p>
        <p class="font-display text-3xl font-bold gradient-text" id="kpiTotal">0</p>
      </div>
      <div class="glass rounded-2xl p-5">
        <p class="text-xs text-slate-400 font-semibold uppercase mb-2">Ativas</p>
        <p class="font-display text-3xl font-bold text-emerald-400" id="kpiAtivas">0</p>
      </div>
      <div class="glass rounded-2xl p-5">
        <p class="text-xs text-slate-400 font-semibold uppercase mb-2">Em Trial</p>
        <p class="font-display text-3xl font-bold text-indigo-300" id="kpiTrial">0</p>
      </div>
      <div class="glass rounded-2xl p-5">
        <p class="text-xs text-slate-400 font-semibold uppercase mb-2">Admins</p>
        <p class="font-display text-3xl font-bold gradient-text" id="kpiAdmins">0</p>
      </div>
    </div>

    <!-- Busca e Nova Empresa -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <input type="text" id="searchInput" class="input-field flex-1 px-4 py-3 rounded-xl text-sm" placeholder="🔍 Buscar empresa...">
      <button id="btnNovaEmpresa" class="btn-gradient px-6 py-3 rounded-xl text-sm font-semibold whitespace-nowrap">
        ✨ Nova Empresa
      </button>
    </div>

    <!-- Tabela -->
    <div class="glass rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-white/5 border-b border-white/10">
            <tr>
              <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase">Empresa</th>
              <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase">CNPJ</th>
              <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase">Admin</th>
              <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase">Plano</th>
              <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase">Status</th>
              <th class="px-6 py-4 text-right text-xs font-bold text-slate-400 uppercase">Ações</th>
            </tr>
          </thead>
          <tbody id="empresasBody" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden p-12 text-center">
        <p class="text-5xl mb-4">🏢</p>
        <p class="text-slate-300 font-semibold mb-2">Nenhuma empresa cadastrada</p>
        <button id="btnNovaEmpresaEmpty" class="btn-gradient px-6 py-3 rounded-xl text-sm font-semibold mt-4">
          ✨ Cadastrar primeira empresa
        </button>
      </div>
    </div>
  </main>
</div>

<!-- MODAL NOVA EMPRESA -->
<div id="modalNovaEmpresa" class="fixed inset-0 z-50 hidden bg-black/70 flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-6">
      <h2 class="font-display font-bold text-xl gradient-text">🏢 Nova Empresa</h2>
      <button id="btnFecharModal" class="text-slate-400 hover:text-white text-2xl">&times;</button>
    </div>
    <div id="modalMsg" class="hidden mb-4 px-4 py-3 rounded-xl text-sm"></div>
    <form id="formNovaEmpresa" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">Nome da Empresa *</label>
        <input type="text" id="empNome" class="input-field w-full px-4 py-3 rounded-xl text-sm" required>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2">CNPJ</label>
          <input type="text" id="empCnpj" class="input-field w-full px-4 py-3 rounded-xl text-sm" maxlength="18">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2">Telefone</label>
          <input type="text" id="empTelefone" class="input-field w-full px-4 py-3 rounded-xl text-sm">
        </div>
      </div>
      <div class="pt-4 border-t border-white/10">
        <p class="text-xs font-bold text-slate-300 mb-3 uppercase">👤 Admin da Empresa</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">Nome do Admin *</label>
        <input type="text" id="adminNome" class="input-field w-full px-4 py-3 rounded-xl text-sm" required>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">Email do Admin *</label>
        <input type="email" id="adminEmail" class="input-field w-full px-4 py-3 rounded-xl text-sm" required>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">Senha *</label>
        <div class="flex gap-2">
          <input type="text" id="adminSenha" class="input-field flex-1 px-4 py-3 rounded-xl text-sm font-mono" required>
          <button type="button" id="btnGerarSenha" class="btn-gradient px-4 py-3 rounded-xl text-xs font-semibold">🎲 Gerar</button>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">Plano</label>
        <select id="empPlano" class="input-field w-full px-4 py-3 rounded-xl text-sm">
          <option value="trial">Trial (14 dias)</option>
          <option value="basico">Básico</option>
          <option value="pro">Pro</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>
      <div class="flex gap-3 pt-4">
        <button type="button" id="btnCancelarModal" class="glass flex-1 px-4 py-3 rounded-xl text-sm font-semibold">Cancelar</button>
        <button type="submit" id="btnCriarEmpresa" class="btn-gradient flex-1 px-4 py-3 rounded-xl text-sm font-semibold">Criar Empresa</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL CREDENCIAIS -->
<div id="modalCredenciais" class="fixed inset-0 z-50 hidden bg-black/70 flex items-center justify-center p-4">
  <div class="glass rounded-3xl p-6 max-w-md w-full">
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto rounded-full bg-emerald-500/20 flex items-center justify-center mb-3">
        <span class="text-3xl">✅</span>
      </div>
      <h2 class="font-display font-bold text-xl gradient-text">Empresa Criada!</h2>
    </div>
    <div class="space-y-3 mb-6">
      <div class="glass rounded-xl p-4">
        <p class="text-[10px] uppercase text-slate-500 font-bold mb-1">Empresa</p>
        <p class="text-sm" id="credEmpresa">—</p>
      </div>
      <div class="glass rounded-xl p-4">
        <p class="text-[10px] uppercase text-slate-500 font-bold mb-1">Email</p>
        <p class="text-sm font-mono" id="credEmail">—</p>
      </div>
      <div class="glass rounded-xl p-4">
        <p class="text-[10px] uppercase text-slate-500 font-bold mb-1">Senha</p>
        <p class="text-sm font-mono" id="credSenha">—</p>
      </div>
    </div>
    <div class="flex gap-3">
      <button id="btnCopiarCred" class="btn-gradient flex-1 px-4 py-3 rounded-xl text-sm font-semibold">📋 Copiar</button>
      <button id="btnFecharCred" class="glass flex-1 px-4 py-3 rounded-xl text-sm font-semibold">Fechar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const SUPA_URL = 'https://ippykisvjqmigobagzjt.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwcHlraXN2anFtaWdvYmFnemp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjU5NDUsImV4cCI6MjEwMzM0MTk0NX0.m0TuMyIxW_UaW1H9HUiKVn_711PFrxIk8y-kFw-OhKc';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const MASTER_EMAIL = 'admin@facige.com';
const MASTER_SENHA = 'Facige@Master2024';

let empresas = [];
let admins = [];

console.log('🚀 Facige Master iniciado');

// ═══════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  console.log('🔐 Tentando login...');
  
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const senha = document.getElementById('loginSenha').value;
  const btn = document.getElementById('loginBtn');
  const msgBox = document.getElementById('loginMsg');
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  msgBox.classList.add('hidden');
  
  try {
    if (email === MASTER_EMAIL && senha === MASTER_SENHA) {
      console.log('✅ Super admin autenticado');
      sessionStorage.setItem('facige_master', JSON.stringify({ nome: 'NeoGe Master', email }));
      entrarApp();
      return;
    }
    
    const { data: user, error } = await sb
      .from('admin_users')
      .select('*')
      .eq('email', email)
      .eq('role', 'super_admin')
      .maybeSingle();
    
    if (error || !user || user.senha !== senha) {
      throw new Error('Credenciais inválidas');
    }
    
    sessionStorage.setItem('facige_master', JSON.stringify(user));
    entrarApp();
    
  } catch (err) {
    console.error('❌ Erro:', err);
    msgBox.textContent = err.message;
    msgBox.className = 'mb-4 px-4 py-3 rounded-xl text-sm';
    msgBox.style.background = 'rgba(239,68,68,.1)';
    msgBox.style.color = '#fca5a5';
    msgBox.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Acessar Painel Master';
  }
});

function entrarApp() {
  console.log('📱 Entrando no app...');
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  carregarDados();
}

document.getElementById('btnLogout').addEventListener('click', function() {
  sessionStorage.removeItem('facige_master');
  location.reload();
});

// ═══════════════════════════════════════════
// CARREGAR DADOS
// ═══════════════════════════════════════════
async function carregarDados() {
  console.log('📊 Carregando dados...');
  
  try {
    const [empRes, admRes] = await Promise.all([
      sb.from('empresas').select('*').order('criado_em', { ascending: false }),
      sb.from('admin_users').select('*').neq('role', 'super_admin')
    ]);
    
    empresas = empRes.data || [];
    admins = admRes.data || [];
    
    console.log(`✅ ${empresas.length} empresas, ${admins.length} admins`);
    
    atualizarKPIs();
    renderEmpresas(empresas);
  } catch (err) {
    console.error('❌ Erro ao carregar:', err);
  }
}

function atualizarKPIs() {
  document.getElementById('kpiTotal').textContent = empresas.length;
  document.getElementById('kpiAtivas').textContent = empresas.filter(e => e.conta_ativa).length;
  document.getElementById('kpiTrial').textContent = empresas.filter(e => e.plano === 'trial').length;
  document.getElementById('kpiAdmins').textContent = admins.length;
}

// ═══════════════════════════════════════════
// BUSCA
// ═══════════════════════════════════════════
document.getElementById('searchInput').addEventListener('input', function(e) {
  const termo = e.target.value.toLowerCase().trim();
  if (!termo) {
    renderEmpresas(empresas);
    return;
  }
  const filtradas = empresas.filter(emp => {
    const admin = admins.find(a => a.empresa_id === emp.id);
    return (
      emp.nome.toLowerCase().includes(termo) ||
      (emp.cnpj || '').includes(termo) ||
      (admin && admin.email.toLowerCase().includes(termo))
    );
  });
  renderEmpresas(filtradas);
});

// ═══════════════════════════════════════════
// RENDERIZAR TABELA
// ═══════════════════════════════════════════
function renderEmpresas(lista) {
  const body = document.getElementById('empresasBody');
  const empty = document.getElementById('emptyState');
  
  if (!lista.length) {
    body.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  
  empty.classList.add('hidden');
  
  body.innerHTML = lista.map(emp => {
    const admin = admins.find(a => a.empresa_id === emp.id);
    const badgeStatus = emp.conta_ativa 
      ? '<span class="inline-flex px-3 py-1 rounded-full text-[11px] font-bold badge-active">Ativa</span>'
      : '<span class="inline-flex px-3 py-1 rounded-full text-[11px] font-bold badge-inactive">Inativa</span>';
    
    return `
      <tr class="table-row">
        <td class="px-6 py-4">
          <p class="font-semibold text-slate-100">${emp.nome}</p>
          <p class="text-xs text-slate-500">${emp.email_contato || ''}</p>
        </td>
        <td class="px-6 py-4 text-slate-400 font-mono text-xs">${emp.cnpj || '—'}</td>
        <td class="px-6 py-4">
          ${admin ? `<p class="text-sm">${admin.nome}</p><p class="text-xs text-slate-500">${admin.email}</p>` : '<span class="text-slate-600 text-xs italic">Sem admin</span>'}
        </td>
        <td class="px-6 py-4"><span class="inline-flex px-3 py-1 rounded-full text-[11px] font-bold badge-trial">${emp.plano}</span></td>
        <td class="px-6 py-4">${badgeStatus}</td>
        <td class="px-6 py-4 text-right">
          <div class="flex gap-2 justify-end">
            <button class="action-btn glass px-3 py-1.5 rounded-lg text-xs" data-action="toggle" data-id="${emp.id}" title="${emp.conta_ativa ? 'Desativar' : 'Ativar'}">
              ${emp.conta_ativa ? '🔒' : '🔓'}
            </button>
            <button class="action-btn glass px-3 py-1.5 rounded-lg text-xs" data-action="copiar" data-id="${emp.id}" title="Copiar credenciais">
              📋
            </button>
            <button class="action-btn glass px-3 py-1.5 rounded-lg text-xs" data-action="excluir" data-id="${emp.id}" title="Excluir">
              🗑️
            </button>
          </div>
        </td>
      </tr>`;
  }).join('');
  
  // Adicionar event listeners aos botões
  body.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      const id = this.dataset.id;
      console.log(`🔘 Ação: ${action}, ID: ${id}`);
      
      if (action === 'toggle') toggleEmpresa(id);
      else if (action === 'copiar') copiarCredenciaisEmpresa(id);
      else if (action === 'excluir') excluirEmpresa(id);
    });
  });
}

// ═══════════════════════════════════════════
// AÇÕES
// ═══════════════════════════════════════════
async function toggleEmpresa(id) {
  const emp = empresas.find(e => e.id === id);
  if (!emp) return;
  
  const novoStatus = !emp.conta_ativa;
  const { error } = await sb.from('empresas').update({ conta_ativa: novoStatus }).eq('id', id);
  
  if (error) {
    alert('❌ Erro: ' + error.message);
    return;
  }
  
  emp.conta_ativa = novoStatus;
  atualizarKPIs();
  renderEmpresas(empresas);
  alert(novoStatus ? '🔓 Empresa ativada' : '🔒 Empresa desativada');
}

function copiarCredenciaisEmpresa(id) {
  const emp = empresas.find(e => e.id === id);
  const admin = admins.find(a => a.empresa_id === id);
  
  if (!admin) {
    alert('⚠️ Esta empresa não tem admin.');
    return;
  }
  
  const texto = `EMPRESA: ${emp.nome}\nEMAIL: ${admin.email}\nSENHA: ${admin.senha}`;
  navigator.clipboard.writeText(texto).then(() => alert('✅ Copiado!'));
}

async function excluirEmpresa(id) {
  const emp = empresas.find(e => e.id === id);
  if (!confirm(`Excluir "${emp.nome}"? Esta ação não pode ser desfeita.`)) return;
  
  const { error } = await sb.from('empresas').delete().eq('id', id);
  if (error) {
    alert('❌ Erro: ' + error.message);
    return;
  }
  
  await carregarDados();
  alert('✅ Empresa excluída');
}

// ═══════════════════════════════════════════
// MODAL NOVA EMPRESA
// ═══════════════════════════════════════════
document.getElementById('btnNovaEmpresa').addEventListener('click', abrirModalNovaEmpresa);
document.getElementById('btnNovaEmpresaEmpty').addEventListener('click', abrirModalNovaEmpresa);
document.getElementById('btnFecharModal').addEventListener('click', () => fecharModal('modalNovaEmpresa'));
document.getElementById('btnCancelarModal').addEventListener('click', () => fecharModal('modalNovaEmpresa'));
document.getElementById('btnGerarSenha').addEventListener('click', gerarSenha);

function abrirModalNovaEmpresa() {
  console.log('✨ Abrindo modal nova empresa');
  document.getElementById('formNovaEmpresa').reset();
  gerarSenha();
  document.getElementById('modalMsg').classList.add('hidden');
  document.getElementById('modalNovaEmpresa').classList.remove('hidden');
}

function fecharModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function gerarSenha() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
  let senha = '';
  for (let i = 0; i < 12; i++) {
    senha += chars[Math.floor(Math.random() * chars.length)];
  }
  document.getElementById('adminSenha').value = senha;
}

document.getElementById('formNovaEmpresa').addEventListener('submit', async function(e) {
  e.preventDefault();
  console.log('📝 Criando empresa...');
  
  const btn = document.getElementById('btnCriarEmpresa');
  const msgBox = document.getElementById('modalMsg');
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  msgBox.classList.add('hidden');
  
  const nome = document.getElementById('empNome').value.trim();
  const cnpj = document.getElementById('empCnpj').value.trim();
  const telefone = document.getElementById('empTelefone').value.trim();
  const adminNome = document.getElementById('adminNome').value.trim();
  const adminEmail = document.getElementById('adminEmail').value.trim().toLowerCase();
  const adminSenha = document.getElementById('adminSenha').value;
  const plano = document.getElementById('empPlano').value;
  
  try {
    // Verificar email duplicado
    const { data: emailExiste } = await sb.from('admin_users').select('id').eq('email', adminEmail).maybeSingle();
    if (emailExiste) throw new Error('Email já em uso.');
    
    // Criar empresa
    const { data: novaEmpresa, error: errEmp } = await sb.from('empresas').insert({
      nome, cnpj: cnpj || null, email_contato: adminEmail, telefone: telefone || null, plano, conta_ativa: true
    }).select().single();
    
    if (errEmp) throw new Error('Erro ao criar empresa: ' + errEmp.message);
    
    // Criar admin
    const { error: errAdm } = await sb.from('admin_users').insert({
      empresa_id: novaEmpresa.id, nome: adminNome, email: adminEmail, senha: adminSenha, role: 'admin', ativo: true
    });
    
    if (errAdm) {
      await sb.from('empresas').delete().eq('id', novaEmpresa.id);
      throw new Error('Erro ao criar admin: ' + errAdm.message);
    }
    
    fecharModal('modalNovaEmpresa');
    mostrarCredenciais(novaEmpresa, adminEmail, adminSenha);
    await carregarDados();
    
  } catch (err) {
    msgBox.textContent = err.message;
    msgBox.style.background = 'rgba(239,68,68,.1)';
    msgBox.style.color = '#fca5a5';
    msgBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Criar Empresa';
  }
});

// ═══════════════════════════════════════════
// MODAL CREDENCIAIS
// ═══════════════════════════════════════════
function mostrarCredenciais(empresa, email, senha) {
  document.getElementById('credEmpresa').textContent = empresa.nome;
  document.getElementById('credEmail').textContent = email;
  document.getElementById('credSenha').textContent = senha;
  document.getElementById('modalCredenciais').classList.remove('hidden');
}

document.getElementById('btnCopiarCred').addEventListener('click', function() {
  const texto = `EMPRESA: ${document.getElementById('credEmpresa').textContent}
EMAIL: ${document.getElementById('credEmail').textContent}
SENHA: ${document.getElementById('credSenha').textContent}`;
  navigator.clipboard.writeText(texto).then(() => alert('✅ Copiado!'));
});

document.getElementById('btnFecharCred').addEventListener('click', () => fecharModal('modalCredenciais'));

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
(function init() {
  console.log('🔍 Verificando sessão...');
  const salvo = sessionStorage.getItem('facige_master');
  if (salvo) {
    try {
      JSON.parse(salvo);
      entrarApp();
    } catch(e) {
      sessionStorage.removeItem('facige_master');
    }
  }
})();
</script>
